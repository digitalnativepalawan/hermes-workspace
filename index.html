<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes — Your Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Berkeley+Mono&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0e;
    --s1: #111114;
    --s2: #18181c;
    --s3: #222228;
    --s4: #2a2a32;
    --bd: #ffffff0a;
    --bd2: #ffffff14;
    --bd3: #ffffff20;
    --tx: #f2f2f5;
    --t1: #c8c8d4;
    --t2: #8888a0;
    --t3: #44445a;
    --red: #e63946;
    --rF: #e6394610;
    --rM: #e6394628;
    --grn: #34d399;
    --gF: #34d39910;
    --amb: #fbbf24;
    --aF: #fbbf2410;
    --blu: #60a5fa;
    --bF: #60a5fa10;
    --sans: 'Instrument Sans', system-ui, sans-serif;
    --mono: 'Berkeley Mono', 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--tx); font-family: var(--sans); font-size: 13px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  ::-webkit-scrollbar { width: 3px; height: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--bd2); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  /* ── Topbar ── */
  .topbar { background: var(--s1); border-bottom: 1px solid var(--bd); height: 46px; display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0; }
  .logo { width: 28px; height: 28px; border-radius: 50%; background: var(--red); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; font-family: var(--mono); flex-shrink: 0; }
  .wordmark { font-size: 14px; font-weight: 600; letter-spacing: -0.02em; color: var(--tx); }
  .nav-sep { width: 1px; height: 18px; background: var(--bd); }
  .nav-btn { padding: 4px 10px; border-radius: 6px; border: none; background: none; color: var(--t2); font-size: 12px; font-family: var(--sans); cursor: pointer; transition: all .12s; font-weight: 500; }
  .nav-btn:hover { background: var(--s3); color: var(--t1); }
  .nav-btn.active { background: var(--s3); color: var(--tx); }
  .spacer { flex: 1; }
  .status-pill { display: flex; align-items: center; gap: 5px; padding: 4px 10px; background: var(--s2); border: 1px solid var(--bd); border-radius: 20px; font-size: 11px; color: var(--t2); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--grn); animation: pulse 2.5s ease-in-out infinite; }
  .clock { font-size: 11px; color: var(--t3); font-family: var(--mono); }

  /* ── Views ── */
  .view { display: none; flex: 1; overflow: hidden; }
  .view.active { display: flex; }

  /* ── Projects Grid ── */
  #projects-view { flex-direction: column; overflow-y: auto; padding: 24px; gap: 20px; }
  .projects-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .projects-title { font-size: 20px; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 3px; }
  .projects-sub { font-size: 12px; color: var(--t3); }
  .btn-primary { padding: 8px 16px; background: var(--red); border: none; color: #fff; border-radius: 8px; font-size: 12px; font-weight: 600; font-family: var(--sans); cursor: pointer; letter-spacing: 0.01em; transition: opacity .15s; }
  .btn-primary:hover { opacity: .88; }
  .btn-ghost { padding: 7px 13px; background: none; border: 1px solid var(--bd2); color: var(--t2); border-radius: 7px; font-size: 12px; font-family: var(--sans); cursor: pointer; transition: all .12s; }
  .btn-ghost:hover { border-color: var(--bd3); color: var(--t1); background: var(--s2); }
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .proj-card { background: var(--s1); border: 1px solid var(--bd); border-radius: 12px; overflow: hidden; cursor: pointer; transition: all .15s; position: relative; }
  .proj-card:hover { border-color: var(--bd2); transform: translateY(-1px); }
  .proj-card-thumb { height: 130px; background: var(--s2); overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
  .proj-card-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .proj-card-thumb-empty { font-size: 32px; opacity: .08; }
  .proj-card-count { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.6); border-radius: 4px; padding: 2px 7px; font-size: 10px; color: var(--t2); font-family: var(--mono); }
  .proj-card-body { padding: 13px 14px; }
  .proj-card-emoji { font-size: 16px; margin-bottom: 6px; }
  .proj-card-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 3px; }
  .proj-card-desc { font-size: 11px; color: var(--t2); line-height: 1.5; margin-bottom: 10px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .proj-card-bar { height: 3px; background: var(--s4); border-radius: 2px; margin-bottom: 6px; }
  .proj-card-fill { height: 100%; border-radius: 2px; transition: width .4s; }
  .proj-card-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--t3); }
  .proj-card-accent { position: absolute; top: 0; left: 0; right: 0; height: 2px; }

  /* ── Project Workspace ── */
  #workspace-view { flex-direction: row; }
  .ws-left { width: 260px; background: var(--s1); border-right: 1px solid var(--bd); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
  .ws-center { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .ws-right { width: 300px; background: var(--s1); border-left: 1px solid var(--bd); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }

  .panel-header { padding: 12px 14px; border-bottom: 1px solid var(--bd); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
  .panel-title { font-size: 11px; font-weight: 600; color: var(--t2); letter-spacing: .06em; text-transform: uppercase; }
  .panel-action { width: 22px; height: 22px; border-radius: 5px; background: none; border: 1px solid var(--bd2); color: var(--t2); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .12s; }
  .panel-action:hover { background: var(--s3); color: var(--t1); }

  .storage-tabs { display: flex; border-bottom: 1px solid var(--bd); flex-shrink: 0; }
  .stab { flex: 1; padding: 8px 4px; border: none; background: none; font-size: 11px; font-family: var(--sans); color: var(--t3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .12s; font-weight: 500; }
  .stab.active { color: var(--tx); border-bottom-color: var(--red); }

  .storage-content { flex: 1; overflow-y: auto; padding: 10px; }

  .asset-item { display: flex; align-items: center; gap: 9px; padding: 8px 9px; border-radius: 7px; cursor: pointer; transition: background .1s; border: 1px solid transparent; margin-bottom: 3px; }
  .asset-item:hover { background: var(--s2); border-color: var(--bd); }
  .asset-item.active { background: var(--s2); border-color: var(--bd2); }
  .asset-icon { width: 32px; height: 32px; border-radius: 6px; background: var(--s3); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; overflow: hidden; }
  .asset-icon img { width: 100%; height: 100%; object-fit: cover; }
  .asset-info { flex: 1; min-width: 0; }
  .asset-name { font-size: 12px; color: var(--t1); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px; }
  .asset-meta { font-size: 10px; color: var(--t3); font-family: var(--mono); }
  .asset-del { width: 18px; height: 18px; border-radius: 3px; background: none; border: none; color: var(--t3); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .1s; flex-shrink: 0; }
  .asset-item:hover .asset-del { opacity: 1; }
  .asset-del:hover { color: var(--red); }

  .drop-zone { border: 2px dashed var(--bd2); border-radius: 9px; padding: 18px 12px; text-align: center; cursor: pointer; transition: all .15s; margin-bottom: 8px; }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--red); background: var(--rF); }
  .drop-zone-icon { font-size: 22px; opacity: .3; margin-bottom: 6px; }
  .drop-zone-text { font-size: 11px; color: var(--t3); line-height: 1.6; }
  .drop-zone-text strong { color: var(--t2); display: block; margin-bottom: 2px; }

  .url-input-wrap { display: flex; gap: 5px; margin-bottom: 8px; }
  .url-input { flex: 1; padding: 6px 9px; background: var(--s2); border: 1px solid var(--bd); color: var(--tx); border-radius: 6px; font-size: 11px; font-family: var(--mono); outline: none; }
  .url-input:focus { border-color: var(--red); }
  .url-add-btn { padding: 6px 10px; background: var(--s3); border: 1px solid var(--bd2); color: var(--t1); border-radius: 6px; font-size: 11px; cursor: pointer; font-family: var(--sans); transition: all .12s; white-space: nowrap; }
  .url-add-btn:hover { background: var(--s4); }

  .gh-download { background: var(--s2); border: 1px solid var(--bd); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .gh-download-title { font-size: 11px; font-weight: 600; color: var(--t1); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .gh-download-sub { font-size: 10px; color: var(--t3); margin-bottom: 10px; line-height: 1.5; font-family: var(--mono); }
  .gh-download-btn { width: 100%; padding: 7px; background: var(--s3); border: 1px solid var(--bd2); color: var(--t1); border-radius: 6px; font-size: 11px; font-family: var(--sans); cursor: pointer; font-weight: 500; transition: all .12s; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
  .gh-download-btn:hover { background: var(--s4); border-color: var(--bd3); }

  .code-file-item { padding: 7px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; transition: background .1s; display: flex; align-items: center; gap: 8px; }
  .code-file-item:hover { background: var(--s2); }
  .code-file-item.active { background: var(--s2); border: 1px solid var(--bd2); }
  .code-ext { font-size: 9px; font-family: var(--mono); width: 26px; text-align: right; flex-shrink: 0; }
  .code-path { font-size: 11px; color: var(--t1); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .ws-proj-header { padding: 14px 18px 12px; border-bottom: 1px solid var(--bd); flex-shrink: 0; }
  .ws-proj-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .ws-proj-emoji { font-size: 22px; }
  .ws-proj-name { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
  .ws-proj-links { display: flex; gap: 5px; flex-wrap: wrap; }
  .link-chip { padding: 3px 9px; background: none; border: 1px solid var(--bd2); color: var(--t2); border-radius: 4px; font-size: 10px; text-decoration: none; font-family: var(--mono); transition: all .12s; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }
  .link-chip:hover { border-color: var(--bd3); color: var(--t1); }
  .ws-tabs { display: flex; border-bottom: 1px solid var(--bd); flex-shrink: 0; }
  .ws-tab { padding: 8px 14px; border: none; background: none; font-size: 12px; font-family: var(--sans); color: var(--t2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .12s; white-space: nowrap; font-weight: 500; }
  .ws-tab.active { color: var(--tx); border-bottom-color: var(--red); }

  .code-viewer { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .code-viewer-bar { padding: 8px 14px; border-bottom: 1px solid var(--bd); font-size: 11px; color: var(--t3); font-family: var(--mono); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; background: var(--s1); }
  .code-content { flex: 1; overflow: auto; padding: 14px; }
  pre { font-family: var(--mono); font-size: 11px; line-height: 1.7; color: var(--t1); white-space: pre; background: transparent; }

  .gallery-grid { flex: 1; overflow-y: auto; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; align-content: start; }
  .gallery-item { border-radius: 8px; overflow: hidden; border: 1px solid var(--bd); position: relative; cursor: pointer; transition: border-color .1s; }
  .gallery-item:hover { border-color: var(--bd2); }
  .gallery-item img { width: 100%; aspect-ratio: 16/10; object-fit: cover; object-position: top; display: block; }
  .gallery-item-label { padding: 5px 8px; font-size: 10px; color: var(--t2); background: var(--s2); border-top: 1px solid var(--bd); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gallery-del { position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; border-radius: 4px; background: rgba(0,0,0,.7); border: none; color: var(--t2); font-size: 12px; cursor: pointer; display: none; align-items: center; justify-content: center; }
  .gallery-item:hover .gallery-del { display: flex; }
  .gallery-del:hover { color: var(--red); }

  .chat-messages { flex: 1; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 14px; }
  .chat-msg { animation: rise .2s ease; }
  .chat-msg-role { font-size: 10px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
  .chat-msg-bubble { background: var(--s2); border: 1px solid var(--bd); border-radius: 10px; padding: 9px 11px; font-size: 12px; line-height: 1.7; color: var(--t1); white-space: pre-wrap; }
  .chat-msg-bubble.user-bubble { background: transparent; border: none; padding: 0; color: var(--t2); font-size: 12px; }
  .step-log { background: var(--bg); border: 1px solid var(--bd); border-radius: 7px; padding: 9px 11px; margin-top: 8px; max-height: 120px; overflow-y: auto; }
  .step-line { font-size: 10px; font-family: var(--mono); color: var(--t3); margin-bottom: 3px; line-height: 1.5; display: flex; gap: 7px; }
  .step-line.ok { color: var(--grn); }
  .step-line.warn { color: var(--amb); }
  .proof-grid { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--gF); border-radius: 7px; overflow: hidden; margin-top: 8px; }
  .proof-label { padding: 4px 8px; font-size: 9px; font-family: var(--mono); border-bottom: 1px solid var(--bd); }
  .proof-img { height: 80px; overflow: hidden; background: var(--s2); }
  .proof-img img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .chat-input-area { padding: 10px 12px; border-top: 1px solid var(--bd); flex-shrink: 0; }
  .chat-input-wrap { display: flex; gap: 6px; align-items: flex-end; background: var(--s2); border: 1px solid var(--bd); border-radius: 10px; padding: 8px 10px; }
  .chat-input-wrap:focus-within { border-color: var(--bd3); }
  .chat-textarea { flex: 1; resize: none; background: none; border: none; color: var(--tx); font-size: 12px; font-family: var(--sans); line-height: 1.5; max-height: 100px; height: 18px; outline: none; }
  .chat-send { width: 28px; height: 28px; border-radius: 7px; background: var(--red); border: none; color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity .15s; }
  .chat-send:disabled { opacity: .4; cursor: not-allowed; }
  .chat-send:hover:not(:disabled) { opacity: .85; }

  .suggestions { padding: 0 12px 8px; display: flex; gap: 5px; flex-wrap: wrap; }
  .sug-btn { padding: 5px 10px; background: var(--s2); border: 1px solid var(--bd); color: var(--t2); border-radius: 20px; font-size: 11px; font-family: var(--sans); cursor: pointer; transition: all .12s; white-space: nowrap; }
  .sug-btn:hover { border-color: var(--bd3); color: var(--t1); }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
  .modal { background: var(--s1); border: 1px solid var(--bd2); border-radius: 14px; padding: 24px; width: 400px; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  .modal-title { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 4px; }
  .modal-sub { font-size: 12px; color: var(--t3); margin-bottom: 18px; }
  .field-label { font-size: 11px; font-weight: 500; color: var(--t2); margin-bottom: 4px; display: block; }
  .field-input { width: 100%; padding: 8px 10px; background: var(--s2); border: 1px solid var(--bd); color: var(--tx); border-radius: 7px; font-size: 12px; font-family: var(--sans); outline: none; margin-bottom: 12px; }
  .field-input:focus { border-color: var(--red); }
  textarea.field-input { height: 60px; resize: none; font-family: var(--sans); }
  .modal-row { display: flex; gap: 7px; margin-top: 4px; }

  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 36px 20px; text-align: center; gap: 8px; flex: 1; }
  .empty-icon { font-size: 32px; opacity: .12; }
  .empty-title { font-size: 13px; font-weight: 500; color: var(--t2); }
  .empty-sub { font-size: 11px; color: var(--t3); line-height: 1.6; }
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="logo">H</div>
  <div class="wordmark">Hermes</div>
  <div class="nav-sep"></div>
  <button class="nav-btn active" id="nav-projects" onclick="showView('projects')">Projects</button>
  <button class="nav-btn" id="nav-agent" onclick="showView('agent')">Agent</button>
  <button class="nav-btn" id="nav-ws-btn" onclick="showView('workspace')" style="display:none">Workspace</button>
  <div class="spacer"></div>
  <div class="status-pill">
    <div class="status-dot" id="sdot"></div>
    <span id="slabel" style="font-size:11px">ready</span>
  </div>
  <button class="nav-btn" onclick="openSettings()" title="Settings" style="font-size:15px;padding:2px 8px;color:var(--t2)">⚙</button>
  <div class="clock" id="clock"></div>
</div>

<!-- AGENT VIEW -->
<div class="view" id="agent-view" style="overflow-y:auto;display:none">
  <div id="root"></div>
</div>

<!-- PROJECTS VIEW -->
<div class="view active" id="projects-view">
  <div class="projects-header">
    <div>
      <div class="projects-title">Your Projects</div>
      <div class="projects-sub" id="proj-sub">Storage · Code · Screenshots · Everything in one place</div>
    </div>
    <button class="btn-primary" onclick="openNewProjectModal()">+ New Project</button>
  </div>
  <div class="projects-grid" id="projects-grid"></div>
</div>

<!-- WORKSPACE VIEW -->
<div class="view" id="workspace-view">
  <!-- Left: Storage Panel -->
  <div class="ws-left">
    <div class="panel-header">
      <div class="panel-title" id="ws-proj-label">Storage</div>
      <div style="display:flex;gap:4px">
        <button class="panel-action" onclick="openEditProjectModal()" title="Edit project" style="font-size:11px">✏</button>
        <button class="panel-action" onclick="confirmDeleteProject()" title="Delete project" style="font-size:11px;color:var(--red);border-color:var(--red)30">🗑</button>
        <button class="panel-action" onclick="showView('projects')" title="All projects" style="font-size:11px">←</button>
      </div>
    </div>
    <div class="storage-tabs">
      <button class="stab active" onclick="switchStorageTab('images')">Images</button>
      <button class="stab" onclick="switchStorageTab('urls')">URLs</button>
      <button class="stab" onclick="switchStorageTab('code')">Code</button>
    </div>
    <div class="storage-content" id="storage-content"></div>
  </div>

  <!-- Center: Work Area -->
  <div class="ws-center">
    <div class="ws-proj-header">
      <div class="ws-proj-top">
        <div class="ws-proj-emoji" id="ws-emoji"></div>
        <div class="ws-proj-name" id="ws-name"></div>
      </div>
      <div class="ws-proj-links" id="ws-links"></div>
    </div>
    <div class="ws-tabs">
      <button class="ws-tab active" onclick="switchWorkTab('gallery')">Gallery</button>
      <button class="ws-tab" onclick="switchWorkTab('code')">Code Viewer</button>
      <button class="ws-tab" onclick="switchWorkTab('tasks')">Tasks</button>
    </div>
    <div id="work-area" style="flex:1;display:flex;flex-direction:column;overflow:hidden"></div>
  </div>

  <!-- Right: Hermes Chat -->
  <div class="ws-right">
    <div class="panel-header">
      <div style="display:flex;align-items:center;gap:7px">
        <div class="logo" style="width:22px;height:22px;font-size:10px">H</div>
        <div class="panel-title">Hermes</div>
      </div>
      <div style="display:flex;align-items:center;gap:5px">
        <span id="model-label" onclick="promptModelSwitch()" title="Click to change model" style="font-size:9px;color:var(--t3);font-family:var(--mono);cursor:pointer;padding:2px 6px;border:1px solid var(--bd);border-radius:4px;white-space:nowrap;overflow:hidden;max-width:100px;text-overflow:ellipsis">qwen2.5-coder:7b</span>
        <button class="panel-action" onclick="clearChat()" title="Clear chat" style="font-size:10px">✕</button>
      </div>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="suggestions" id="suggestions"></div>
    <div class="chat-input-area">
      <div class="chat-input-wrap">
        <textarea class="chat-textarea" id="chat-input" placeholder="Talk to Hermes..." onkeydown="chatKeydown(event)" oninput="autoResize(this)"></textarea>
        <button class="chat-send" id="chat-send" onclick="sendChat()">↑</button>
      </div>
    </div>
  </div>
</div>

];

async function executeTool(name, args) {
  const ghToken = localStorage.getItem("hermes_gh_token");
  const vercelToken = localStorage.getItem("hermes_vercel_token");
  const ghH = { "Accept":"application/vnd.github+json", ...(ghToken?{"Authorization":"Bearer "+ghToken}:{}) };
  try {
    if (name === "get_github_repo") {
      const r = await fetch(`https://api.github.com/repos/${args.repo}`, {headers:ghH});
      if (!r.ok) return {error:`GitHub ${r.status}`};
      const d = await r.json();
      return {name:d.full_name, description:d.description, language:d.language, stars:d.stargazers_count, default_branch:d.default_branch, last_push:d.pushed_at, open_issues:d.open_issues_count, topics:d.topics};
    }
    if (name === "get_github_files") {
      const r = await fetch(`https://api.github.com/repos/${args.repo}/contents/${args.path||""}`, {headers:ghH});
      if (!r.ok) return {error:`GitHub ${r.status}`};
      const d = await r.json();
      return Array.isArray(d) ? d.map(f=>({name:f.name, type:f.type, size:f.size})) : {error:"not a directory"};
    }
    if (name === "get_github_file") {
      const r = await fetch(`https://api.github.com/repos/${args.repo}/contents/${args.path}`, {headers:ghH});
      if (!r.ok) return {error:`GitHub ${r.status}`};
      const d = await r.json();
      const content = d.content ? atob(d.content.replace(/\n/g,"")) : "";
      return {path:args.path, content:content.slice(0,4000), truncated:content.length>4000};
    }
    if (name === "get_github_commits") {
      const r = await fetch(`https://api.github.com/repos/${args.repo}/commits?per_page=10`, {headers:ghH});
      if (!r.ok) return {error:`GitHub ${r.status}`};
      const d = await r.json();
      return d.map(c=>({sha:c.sha.slice(0,7), message:c.commit.message.split("\n")[0], author:c.commit.author.name, date:c.commit.author.date}));
    }
    if (name === "get_vercel_deployments") {
      if (!vercelToken) return {error:"No Vercel token. Add in Settings ⚙"};
      const r = await fetch(`https://api.vercel.com/v6/deployments?projectId=${args.project}&limit=5`, {headers:{"Authorization":"Bearer "+vercelToken}});
      if (!r.ok) return {error:`Vercel ${r.status}`};
      const d = await r.json();
      return (d.deployments||[]).map(dep=>({url:dep.url, state:dep.state, created:dep.createdAt}));
    }
    return {error:"Unknown tool: "+name};
  } catch(e) { return {error:e.message}; }
}

async function uploadImageFile(file) {
  const safe = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path = `images/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${safe}`;
  const { error } = await window.__sb.storage.from(window.__BUCKET).upload(path, file, { contentType: file.type, upsert: false });

async function askClaude(messages, sysOverride) {
  const p=proj();
  const open=p?(p.tasks||[]).filter(t=>!t.done).map(t=>t.label+(t.note?" ("+t.note+")":"")).join(", "):"";
  const ghToken    = localStorage.getItem("hermes_gh_token");
  const vercelToken= localStorage.getItem("hermes_vercel_token");

  const system=sysOverride||`You are Hermes — David's technical co-founder. David is a solo founder building hospitality tech in Palawan, Philippines (merQato.digital). Products: BAIA BackOffice (resort OS), PinoyLink (Filipino link-in-bio), merQato.digital (agency site).

Tone: Direct, sharp, occasionally dry. Give real opinions. Push back when needed. No corporate language.

${p?`Current project: ${p.name} — ${p.desc||""}\nOpen tasks: ${open||"all done"}\nGitHub: ${p.github||"none"}\nLive: ${p.vercel||"none"}`:""}
${ghToken?"GitHub token active — use tools to read repo files, commits, structure.":"No GitHub token — cannot read repos."}
${vercelToken?"Vercel token active — use tools to check deployments.":""}

When showing code, put the path on the fence header. Use tools proactively when the user asks about the codebase or deployments.`;

  const apiKey = localStorage.getItem("hermes_api_key");

  // Anthropic path (no tool loop yet — straight chat)
  if (apiKey && apiKey.startsWith("sk-ant-")) {
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-allow-browser":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:2000,system,messages})
    });
    if(!r.ok) throw new Error("API "+r.status);
    const d=await r.json();
    return d.content.filter(b=>b.type==="text").map(b=>b.text).join("");
  }

  // Ollama agentic loop (max 6 iterations)
  const tools = TOOLS.filter(t => t.function.name.startsWith("get_vercel") ? !!vercelToken : true);
  let msgs = [...messages];

  for (let i = 0; i < 6; i++) {
    const r = await fetch(OLLAMA_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ model:OLLAMA_MODEL, messages:[{role:"system",content:system},...msgs], tools, stream:false })
    });
    if (!r.ok) throw new Error("Ollama "+r.status);
    const d = await r.json();
    const msg = d.choices[0].message;

    if (!msg.tool_calls || msg.tool_calls.length === 0) {
      return msg.content || "";
    }

    msgs.push({ role:"assistant", content:msg.content||"", tool_calls:msg.tool_calls });

    for (const tc of msg.tool_calls) {
      let args = tc.function.arguments;
      if (typeof args === "string") { try { args = JSON.parse(args); } catch { args = {}; } }
      const result = await executeTool(tc.function.name, args);
      addToolStep(tc.function.name, args, result);
      msgs.push({ role:"tool", tool_call_id:tc.id, content:JSON.stringify(result) });
    }
  }

  return "Reached max tool steps.";
}

  setStatus("thinking...","#fbbf24");
  const open=(p.tasks||[]).filter(t=>!t.done);
  const context=`Project: ${p.name} — ${p.desc||""}\nOpen tasks: ${open.map(t=>t.label+(t.note?" ("+t.note+")":"")).join(", ")||"all done"}\nStored: ${(p.images||[]).length} images, ${(p.urls||[]).length} URLs, ${(p.codeFiles||[]).length} code files`;
  try {
    const reply=await askClaude([{role:"user",content:context+"\n\nGive me a quick read on this project in 2-3 sentences. What's the most important thing to do right now and why?"}]);
    addChatMsg("hermes",reply);
    showSugs([...open.slice(0,3).map(t=>"Work on: "+t.label),"What's in my storage?","Review the codebase"]);
  } catch(e) {
    addChatMsg("hermes","Ollama not reachable. Make sure it's running: `ollama serve` — then reload. Storage, tasks, and project tracking work fine without it.");
    showSugs(open.slice(0,3).map(t=>"▶ "+t.label));
  }
  setStatus("ready","#34d399");
}

async function sendChat() {
  const inp=document.getElementById("chat-input");
  const txt=inp.value.trim(); if(!txt||state.thinking) return;
  inp.value=""; autoResize(inp); clearSugs();
  addChatMsg("user",txt);
  state.chatHistory.push({role:"user",content:txt});
  state.thinking=true; setStatus("thinking...","#fbbf24");
  document.getElementById("chat-send").disabled=true;

  const p=proj();
  const lower=txt.toLowerCase();
  if(p && (lower.includes("what's in my storage")||lower.includes("storage"))) {
    const reply=`You've got ${(p.images||[]).length} images, ${(p.urls||[]).length} URLs, and ${(p.codeFiles||[]).length} code files for ${p.name}.`;
    addChatMsg("hermes",reply); state.thinking=false; setStatus("ready","#34d399"); document.getElementById("chat-send").disabled=false; return;
  }

  try {
    const reply=await askClaude(state.chatHistory.map(m=>({role:m.role,content:m.content})));
    state.chatHistory.push({role:"assistant",content:reply});
    addChatMsg("hermes",reply);
    if(p) { const open=(p.tasks||[]).filter(t=>!t.done).slice(0,2); showSugs([...open.map(t=>"Work on: "+t.label),"What's most urgent?"]); }
  } catch(e) {
    addChatMsg("hermes","Can't reach Ollama. Run `ollama serve` in a terminal, then try again.");
  }

  state.thinking=false; setStatus("ready","#34d399"); document.getElementById("chat-send").disabled=false;
}
window.sendChat=sendChat;

function addChatMsg(role, text, extraHtml, msgId) {
  const wrap=document.getElementById("chat-messages");
  const d=document.createElement("div"); d.className="chat-msg";
  if(msgId) d.setAttribute("data-msgid",msgId);
  if(role==="hermes") {
    d.innerHTML=`<div class="chat-msg-role" style="color:var(--red)"><span style="width:4px;height:4px;border-radius:50%;background:var(--red);display:inline-block"></span>Hermes</div><div class="chat-msg-bubble">${text}${extraHtml||""}</div>`;
  } else {
    d.innerHTML=`<div class="chat-msg-role" style="color:var(--t3)">you</div><div class="chat-msg-bubble user-bubble">${text}</div>`;
  }
  wrap.appendChild(d); wrap.scrollTop=wrap.scrollHeight;
}

function clearChat() {
  state.chatHistory=[]; document.getElementById("chat-messages").innerHTML="";
  if(state.activeProjectId) autoGreet();
}
window.clearChat=clearChat;

function showSugs(items) {
  const el=document.getElementById("suggestions"); el.innerHTML="";
  (items||[]).filter(Boolean).slice(0,4).forEach(s=>{
    const btn=document.createElement("button"); btn.className="sug-btn"; btn.textContent=s;
    btn.onclick=()=>{document.getElementById("chat-input").value=s;sendChat();};
    el.appendChild(btn);
  });
}

function clearSugs() { document.getElementById("suggestions").innerHTML=""; }

function chatKeydown(e) { if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat();} }
window.chatKeydown=chatKeydown;

function autoResize(el) { el.style.height="18px"; el.style.height=Math.min(el.scrollHeight,100)+"px"; }
window.autoResize=autoResize;

// ── Boot ──────────────────────────────────────────────────────────────────
(async ()=>{
  await load();
  renderProjectsGrid();
  const ml=document.getElementById("model-label"); if(ml) ml.textContent=OLLAMA_MODEL;
})();

document.getElementById("clock").textContent=new Date().toLocaleTimeString("en-US",{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"});
</script>
</body>
</html>
